[project]
name = "komacut-growth-audit"
version = "0.1.0"
description = "AI-powered PPC + SEO growth audit demo for Komacut"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.12",
]

[project.scripts]
dev = "uvicorn app.main:app --reload"
