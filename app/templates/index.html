<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Komacut Growth Audit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <style>
    [x-cloak] { display: none !important; }
    .tab-active { @apply border-b-2 border-indigo-600 text-indigo-600 font-semibold; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen" x-data="audit()">

  <!-- Header -->
  <header class="bg-white border-b shadow-sm sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold text-indigo-700">Komacut Growth Audit</h1>
        <p class="text-xs text-gray-500">AI-Powered PPC + SEO Analysis</p>
      </div>
      <div class="flex gap-2 items-center">
        <button @click="runAudit()"
          :disabled="loading"
          class="bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-2">
          <span x-show="!loading">▶ Load Demo Data &amp; Run Audit</span>
          <span x-show="loading" x-cloak>⏳ Running audit…</span>
        </button>
        <template x-if="auditDone">
          <button @click="getRecommendations()"
            :disabled="loadingRec"
            class="bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white text-sm font-medium px-4 py-2 rounded-lg">
            <span x-show="!loadingRec">✨ Generate AI Recommendations</span>
            <span x-show="loadingRec" x-cloak>⏳ Asking Claude…</span>
          </button>
        </template>
        <template x-if="auditDone">
          <a href="/export/xlsx" class="bg-gray-700 hover:bg-gray-800 text-white text-sm font-medium px-4 py-2 rounded-lg">
            ⬇ Export XLSX
          </a>
        </template>
      </div>
    </div>
  </header>

  <!-- Error banner -->
  <template x-if="error">
    <div class="max-w-7xl mx-auto mt-4 px-4">
      <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm" x-text="error"></div>
    </div>
  </template>

  <!-- Landing state -->
  <template x-if="!auditDone && !loading">
    <div class="max-w-2xl mx-auto mt-24 text-center px-4">
      <div class="text-5xl mb-4">📊</div>
      <h2 class="text-2xl font-bold mb-2">Ready to audit Komacut's growth</h2>
      <p class="text-gray-500 mb-8">Click "Load Demo Data &amp; Run Audit" to analyse Google Ads spend and SEO opportunities.</p>
      <div class="grid grid-cols-3 gap-4 text-left">
        <div class="bg-white rounded-xl p-4 shadow-sm border">
          <div class="text-2xl mb-1">💸</div>
          <div class="font-semibold text-sm">PPC Waste</div>
          <div class="text-xs text-gray-500">Find zero-conversion keywords burning budget</div>
        </div>
        <div class="bg-white rounded-xl p-4 shadow-sm border">
          <div class="text-2xl mb-1">🔍</div>
          <div class="font-semibold text-sm">SEO Gaps</div>
          <div class="text-xs text-gray-500">Quick-win rankings and competitor opportunities</div>
        </div>
        <div class="bg-white rounded-xl p-4 shadow-sm border">
          <div class="text-2xl mb-1">🤖</div>
          <div class="font-semibold text-sm">AI Actions</div>
          <div class="text-xs text-gray-500">Prioritised recommendations from Claude</div>
        </div>
      </div>
    </div>
  </template>

  <!-- Main dashboard -->
  <template x-if="auditDone">
    <div class="max-w-7xl mx-auto px-4 py-6" x-cloak>

      <!-- Summary cards -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-xl p-4 shadow-sm border">
          <div class="text-xs text-gray-500 uppercase tracking-wide">Wasted Budget</div>
          <div class="text-2xl font-bold text-red-600" x-text="'$' + ppc.summary.waste_total_usd.toLocaleString()"></div>
          <div class="text-xs text-gray-400" x-text="ppc.summary.waste_keywords_count + ' keywords'"></div>
        </div>
        <div class="bg-white rounded-xl p-4 shadow-sm border">
          <div class="text-xs text-gray-500 uppercase tracking-wide">High CPA Keywords</div>
          <div class="text-2xl font-bold text-orange-500" x-text="ppc.summary.high_cpa_count"></div>
          <div class="text-xs text-gray-400">above $120 target</div>
        </div>
        <div class="bg-white rounded-xl p-4 shadow-sm border">
          <div class="text-xs text-gray-500 uppercase tracking-wide">SEO Quick Wins</div>
          <div class="text-2xl font-bold text-emerald-600" x-text="seo.summary.quick_wins_count + seo.summary.near_opportunities_count"></div>
          <div class="text-xs text-gray-400">rankable keywords</div>
        </div>
        <div class="bg-white rounded-xl p-4 shadow-sm border">
          <div class="text-xs text-gray-500 uppercase tracking-wide">Competitor Gaps</div>
          <div class="text-2xl font-bold text-indigo-600" x-text="seo.summary.competitor_gaps_count"></div>
          <div class="text-xs text-gray-400">vs Xometry &amp; Protolabs</div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
        <div class="flex border-b text-sm font-medium text-gray-500">
          <button @click="tab='ppc'" :class="tab==='ppc' ? 'tab-active' : 'hover:text-gray-700'" class="px-5 py-3">PPC Audit</button>
          <button @click="tab='seo'" :class="tab==='seo' ? 'tab-active' : 'hover:text-gray-700'" class="px-5 py-3">SEO Audit</button>
          <button @click="tab='recs'" :class="tab==='recs' ? 'tab-active' : 'hover:text-gray-700'" class="px-5 py-3">
            AI Recommendations
            <span x-show="recommendations.length > 0" class="ml-1 bg-emerald-100 text-emerald-700 text-xs px-1.5 py-0.5 rounded-full" x-text="recommendations.length"></span>
          </button>
          <button @click="tab='chat'" :class="tab==='chat' ? 'tab-active' : 'hover:text-gray-700'" class="px-5 py-3">Chat</button>
        </div>

        <!-- PPC Tab -->
        <div x-show="tab==='ppc'" class="p-5 space-y-6">

          <section>
            <h3 class="font-semibold text-red-700 mb-2">💸 Waste Spend Keywords (<span x-text="ppc.waste_spend.length"></span>)</h3>
            <p class="text-xs text-gray-500 mb-3">Keywords with cost > $120 and zero conversions. Pause or reduce bids immediately.</p>
            <table class="w-full text-sm border-collapse">
              <thead><tr class="bg-gray-50 text-left text-xs uppercase text-gray-500">
                <th class="px-3 py-2">Keyword</th><th class="px-3 py-2">Campaign</th><th class="px-3 py-2">Cost</th><th class="px-3 py-2">Clicks</th>
              </tr></thead>
              <tbody>
                <template x-for="r in ppc.waste_spend" :key="r.keyword">
                  <tr class="border-t hover:bg-red-50">
                    <td class="px-3 py-2 font-medium text-red-700" x-text="r.keyword"></td>
                    <td class="px-3 py-2 text-gray-500 text-xs" x-text="r.campaign"></td>
                    <td class="px-3 py-2 font-semibold text-red-600" x-text="'$' + r.cost.toFixed(2)"></td>
                    <td class="px-3 py-2" x-text="r.clicks"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </section>

          <section>
            <h3 class="font-semibold text-orange-700 mb-2">⚠ High CPA Keywords (<span x-text="ppc.high_cpa.length"></span>)</h3>
            <p class="text-xs text-gray-500 mb-3">Converting but above $120 target CPA. Optimise bids or landing pages.</p>
            <table class="w-full text-sm border-collapse">
              <thead><tr class="bg-gray-50 text-left text-xs uppercase text-gray-500">
                <th class="px-3 py-2">Keyword</th><th class="px-3 py-2">Cost/Conv</th><th class="px-3 py-2">Conversions</th><th class="px-3 py-2">Cost</th>
              </tr></thead>
              <tbody>
                <template x-for="r in ppc.high_cpa" :key="r.keyword">
                  <tr class="border-t hover:bg-orange-50">
                    <td class="px-3 py-2 font-medium" x-text="r.keyword"></td>
                    <td class="px-3 py-2 text-orange-600 font-semibold" x-text="'$' + r.cost_per_conv.toFixed(0)"></td>
                    <td class="px-3 py-2" x-text="r.conversions"></td>
                    <td class="px-3 py-2" x-text="'$' + r.cost.toFixed(2)"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </section>

          <section>
            <h3 class="font-semibold text-gray-700 mb-2">🚫 Negative KW Candidates (<span x-text="ppc.negative_kw_candidates.length"></span>)</h3>
            <p class="text-xs text-gray-500 mb-3">Search terms triggering non-buyer intent. Add as negative keywords.</p>
            <table class="w-full text-sm border-collapse">
              <thead><tr class="bg-gray-50 text-left text-xs uppercase text-gray-500">
                <th class="px-3 py-2">Search Term</th><th class="px-3 py-2">Trigger</th><th class="px-3 py-2">Cost</th>
              </tr></thead>
              <tbody>
                <template x-for="r in ppc.negative_kw_candidates" :key="r.search_term">
                  <tr class="border-t hover:bg-gray-50">
                    <td class="px-3 py-2" x-text="r.search_term"></td>
                    <td class="px-3 py-2"><span class="bg-gray-100 text-gray-600 text-xs px-2 py-0.5 rounded" x-text="r.trigger_word"></span></td>
                    <td class="px-3 py-2 text-gray-500" x-text="'$' + r.cost.toFixed(2)"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </section>

          <section>
            <h3 class="font-semibold text-emerald-700 mb-2">✅ Winning Keywords (<span x-text="ppc.winners.length"></span>)</h3>
            <p class="text-xs text-gray-500 mb-3">Converting at or below $120 CPA. Increase bids and budgets here.</p>
            <table class="w-full text-sm border-collapse">
              <thead><tr class="bg-gray-50 text-left text-xs uppercase text-gray-500">
                <th class="px-3 py-2">Keyword</th><th class="px-3 py-2">Cost/Conv</th><th class="px-3 py-2">Conversions</th>
              </tr></thead>
              <tbody>
                <template x-for="r in ppc.winners" :key="r.keyword">
                  <tr class="border-t hover:bg-emerald-50">
                    <td class="px-3 py-2 font-medium text-emerald-700" x-text="r.keyword"></td>
                    <td class="px-3 py-2 font-semibold" x-text="'$' + r.cost_per_conv.toFixed(0)"></td>
                    <td class="px-3 py-2" x-text="r.conversions"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </section>

        </div>

        <!-- SEO Tab -->
        <div x-show="tab==='seo'" class="p-5 space-y-6">

          <section>
            <h3 class="font-semibold text-indigo-700 mb-2">⚡ Quick-Win Keywords (<span x-text="seo.quick_wins.length"></span>)</h3>
            <p class="text-xs text-gray-500 mb-3">Currently ranking position 4–20. Small content improvements can push these to page 1.</p>
            <table class="w-full text-sm border-collapse">
              <thead><tr class="bg-gray-50 text-left text-xs uppercase text-gray-500">
                <th class="px-3 py-2">Keyword</th><th class="px-3 py-2">Position</th><th class="px-3 py-2">Volume</th><th class="px-3 py-2">Est. Visits</th>
              </tr></thead>
              <tbody>
                <template x-for="r in seo.quick_wins" :key="r.Keywords">
                  <tr class="border-t hover:bg-indigo-50">
                    <td class="px-3 py-2 font-medium" x-text="r.Keywords"></td>
                    <td class="px-3 py-2"><span class="bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5 rounded font-semibold" x-text="'#' + r.Position"></span></td>
                    <td class="px-3 py-2" x-text="r.Volume"></td>
                    <td class="px-3 py-2" x-text="r['Est. Visits']"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </section>

          <section>
            <h3 class="font-semibold text-yellow-700 mb-2">🎯 Near-Opportunity Keywords (<span x-text="seo.near_opportunities.length"></span>)</h3>
            <p class="text-xs text-gray-500 mb-3">Ranking 21–50. Need dedicated content or link building to break onto page 1.</p>
            <table class="w-full text-sm border-collapse">
              <thead><tr class="bg-gray-50 text-left text-xs uppercase text-gray-500">
                <th class="px-3 py-2">Keyword</th><th class="px-3 py-2">Position</th><th class="px-3 py-2">Volume</th>
              </tr></thead>
              <tbody>
                <template x-for="r in seo.near_opportunities" :key="r.Keywords">
                  <tr class="border-t hover:bg-yellow-50">
                    <td class="px-3 py-2 font-medium" x-text="r.Keywords"></td>
                    <td class="px-3 py-2"><span class="bg-yellow-100 text-yellow-700 text-xs px-2 py-0.5 rounded font-semibold" x-text="'#' + r.Position"></span></td>
                    <td class="px-3 py-2" x-text="r.Volume"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </section>

          <section>
            <h3 class="font-semibold text-purple-700 mb-2">🏆 Top Competitor Gaps (<span x-text="seo.competitor_gaps.length"></span>)</h3>
            <p class="text-xs text-gray-500 mb-3">Keywords Xometry and Protolabs rank for that Komacut doesn't. High commercial value.</p>
            <table class="w-full text-sm border-collapse">
              <thead><tr class="bg-gray-50 text-left text-xs uppercase text-gray-500">
                <th class="px-3 py-2">Keyword</th><th class="px-3 py-2">Competitor</th><th class="px-3 py-2">Volume</th><th class="px-3 py-2">CPC</th><th class="px-3 py-2">Priority</th>
              </tr></thead>
              <tbody>
                <template x-for="(r, i) in seo.competitor_gaps" :key="i">
                  <tr class="border-t hover:bg-purple-50">
                    <td class="px-3 py-2 font-medium" x-text="r.Keyword"></td>
                    <td class="px-3 py-2 text-xs text-gray-500" x-text="r.competitor"></td>
                    <td class="px-3 py-2" x-text="r.Volume"></td>
                    <td class="px-3 py-2" x-text="'$' + (r.CPC || 0).toFixed(2)"></td>
                    <td class="px-3 py-2">
                      <span :class="r.priority==='High' ? 'bg-red-100 text-red-700' : r.priority==='Medium' ? 'bg-yellow-100 text-yellow-700' : 'bg-gray-100 text-gray-600'"
                        class="text-xs px-2 py-0.5 rounded font-medium" x-text="r.priority"></span>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </section>

        </div>

        <!-- Recommendations Tab -->
        <div x-show="tab==='recs'" class="p-5">
          <template x-if="recommendations.length === 0 && !loadingRec">
            <div class="text-center py-16 text-gray-400">
              <div class="text-4xl mb-3">✨</div>
              <p class="text-sm">Click "Generate AI Recommendations" to get Claude's prioritised action plan.</p>
            </div>
          </template>
          <template x-if="loadingRec">
            <div class="text-center py-16 text-gray-400">
              <div class="text-4xl mb-3 animate-pulse">🤖</div>
              <p class="text-sm">Claude is analysing the findings…</p>
            </div>
          </template>
          <template x-if="recommendations.length > 0">
            <div>
              <div class="mb-4 text-sm text-gray-500">
                <span x-text="recommendations.length"></span> recommendations generated. Sorted by priority.
              </div>
              <table class="w-full text-sm border-collapse">
                <thead><tr class="bg-gray-50 text-left text-xs uppercase text-gray-500">
                  <th class="px-3 py-2">Priority</th>
                  <th class="px-3 py-2">Module</th>
                  <th class="px-3 py-2">Problem</th>
                  <th class="px-3 py-2">Recommendation</th>
                  <th class="px-3 py-2">Next Action</th>
                </tr></thead>
                <tbody>
                  <template x-for="(r, i) in recommendations" :key="i">
                    <tr class="border-t align-top hover:bg-gray-50">
                      <td class="px-3 py-2">
                        <span :class="r.priority==='High' ? 'bg-red-100 text-red-700' : r.priority==='Medium' ? 'bg-yellow-100 text-yellow-700' : 'bg-gray-100 text-gray-600'"
                          class="text-xs px-2 py-0.5 rounded font-medium" x-text="r.priority"></span>
                      </td>
                      <td class="px-3 py-2 text-xs text-gray-500" x-text="r.module"></td>
                      <td class="px-3 py-2 max-w-xs" x-text="r.problem"></td>
                      <td class="px-3 py-2 max-w-sm" x-text="r.recommendation"></td>
                      <td class="px-3 py-2 text-indigo-700 font-medium text-xs max-w-xs" x-text="r.next_action"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>
        </div>

        <!-- Chat Tab -->
        <div x-show="tab==='chat'" class="p-5 flex flex-col h-[520px]">
          <div class="flex-1 overflow-y-auto space-y-3 mb-4" id="chat-messages">
            <template x-if="chatMessages.length === 0">
              <div class="text-center py-12 text-gray-400">
                <div class="text-3xl mb-2">💬</div>
                <p class="text-sm">Ask anything about the audit findings.</p>
                <div class="mt-3 flex flex-wrap gap-2 justify-center">
                  <button @click="sendChatSuggestion('Which PPC keywords should I pause first?')"
                    class="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-full">Which PPC keywords should I pause first?</button>
                  <button @click="sendChatSuggestion('What are the top 3 SEO actions I should take this week?')"
                    class="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-full">Top 3 SEO actions this week?</button>
                  <button @click="sendChatSuggestion('How much budget am I wasting vs winning?')"
                    class="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-full">Budget waste vs winning?</button>
                </div>
              </div>
            </template>
            <template x-for="(msg, i) in chatMessages" :key="i">
              <div :class="msg.role === 'user' ? 'flex justify-end' : 'flex justify-start'">
                <div :class="msg.role === 'user' ? 'bg-indigo-600 text-white' : 'bg-white border text-gray-800'"
                  class="max-w-lg px-4 py-2.5 rounded-xl text-sm shadow-sm whitespace-pre-wrap" x-text="msg.content"></div>
              </div>
            </template>
            <template x-if="chatLoading">
              <div class="flex justify-start">
                <div class="bg-white border text-gray-400 px-4 py-2.5 rounded-xl text-sm shadow-sm">Thinking…</div>
              </div>
            </template>
          </div>
          <div class="flex gap-2">
            <input x-model="chatInput" @keydown.enter="sendChat()"
              :disabled="!auditDone || chatLoading"
              placeholder="Ask about the audit findings…"
              class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
            <button @click="sendChat()" :disabled="!auditDone || chatLoading || !chatInput.trim()"
              class="bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 text-white text-sm px-4 py-2 rounded-lg">Send</button>
          </div>
        </div>

      </div>
    </div>
  </template>

  <script>
    function audit() {
      return {
        loading: false,
        loadingRec: false,
        chatLoading: false,
        auditDone: false,
        error: null,
        tab: 'ppc',
        ppc: {},
        seo: {},
        recommendations: [],
        chatMessages: [],
        chatInput: '',

        async runAudit() {
          this.loading = true;
          this.error = null;
          try {
            const res = await fetch('/audit/run', { method: 'POST' });
            if (!res.ok) throw new Error(await res.text());
            const data = await res.json();
            this.ppc = data.ppc;
            this.seo = data.seo;
            this.auditDone = true;
          } catch (e) {
            this.error = 'Audit failed: ' + e.message;
          } finally {
            this.loading = false;
          }
        },

        async getRecommendations() {
          this.loadingRec = true;
          this.error = null;
          try {
            const res = await fetch('/audit/recommendations', { method: 'POST' });
            if (!res.ok) throw new Error(await res.text());
            const data = await res.json();
            this.recommendations = data.recommendations;
            this.tab = 'recs';
          } catch (e) {
            this.error = 'Recommendations failed: ' + e.message;
          } finally {
            this.loadingRec = false;
          }
        },

        async sendChat() {
          const msg = this.chatInput.trim();
          if (!msg) return;
          this.chatInput = '';
          this.chatMessages.push({ role: 'user', content: msg });
          this.chatLoading = true;
          this.$nextTick(() => {
            const el = document.getElementById('chat-messages');
            if (el) el.scrollTop = el.scrollHeight;
          });
          try {
            const res = await fetch('/chat', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: msg }),
            });
            if (!res.ok) throw new Error(await res.text());
            const data = await res.json();
            this.chatMessages.push({ role: 'assistant', content: data.reply });
          } catch (e) {
            this.chatMessages.push({ role: 'assistant', content: 'Error: ' + e.message });
          } finally {
            this.chatLoading = false;
            this.$nextTick(() => {
              const el = document.getElementById('chat-messages');
              if (el) el.scrollTop = el.scrollHeight;
            });
          }
        },

        sendChatSuggestion(text) {
          this.chatInput = text;
          this.sendChat();
        },
      };
    }
  </script>
</body>
</html>
